<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘이음 — 검사 결과를 함께 살펴드려요</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 색 — 따뜻한 sage + cream */
            --primary: #5B8E7D;
            --primary-dark: #467566;
            --primary-light: #E8F0EC;
            --primary-soft: #F2F7F4;
            --accent: #E8A87C;
            --accent-soft: #FBE9DC;
            --cream: #FAF6F0;
            --cream-dark: #F4ECDF;

            /* 신호등 (부드럽게) */
            --signal-green: #88B383;
            --signal-green-bg: #E8F2E5;
            --signal-yellow: #D9A93C;
            --signal-yellow-bg: #FBF1D8;
            --signal-coral: #D87A5E;
            --signal-coral-bg: #F9E2D8;

            /* 텍스트 */
            --text: #2D3A3A;
            --text-soft: #5C6B6B;
            --text-light: #8A9595;
            --text-muted: #B0B8B8;

            /* 구조 */
            --bg: #FAF6F0;
            --card: #FFFFFF;
            --border: #E8DFD0;
            --border-soft: #F0E8DB;
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --shadow-xs: 0 1px 3px rgba(45, 58, 58, 0.04);
            --shadow-sm: 0 2px 10px rgba(91, 142, 125, 0.07);
            --shadow-md: 0 6px 24px rgba(91, 142, 125, 0.10);
            --shadow-lg: 0 12px 40px rgba(91, 142, 125, 0.14);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ─────────── Header ─────────── */
        .header {
            position: relative;
            background: linear-gradient(135deg, #5B8E7D 0%, #6BA092 50%, #7BB1A2 100%);
            color: white;
            padding: 2rem 2rem 2.2rem;
            text-align: center;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -10%;
            width: 70%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -50%; right: -10%;
            width: 60%; height: 200%;
            background: radial-gradient(circle, rgba(232,168,124,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .header-inner { position: relative; z-index: 1; }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .header .tagline {
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.92;
            margin-top: 0.4rem;
            letter-spacing: 0.01em;
        }
        .leaf-icon {
            display: inline-block;
            font-size: 1.5rem;
            transform: rotate(-15deg);
            animation: gentle-sway 4s ease-in-out infinite;
        }
        @keyframes gentle-sway {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(-5deg); }
        }

        /* ─────────── Status bar ─────────── */
        .status-bar {
            background: var(--card);
            border-bottom: 1px solid var(--border-soft);
            padding: 0.6rem 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.6rem;
            font-size: 0.82rem;
        }
        .status-bar .status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            font-weight: 500;
        }
        .status-bar .status.ok {
            background: var(--signal-green-bg);
            color: #4A7547;
        }
        .status-bar .status.missing {
            background: var(--signal-coral-bg);
            color: #A04A35;
        }
        .status-bar .status .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* ─────────── Layout ─────────── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.8rem 1.5rem 4rem;
        }

        /* ─────────── Cards ─────────── */
        .card {
            background: var(--card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 1.6rem 1.8rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border-soft);
            animation: fade-up 0.5s ease;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }
        .card h3 .h3-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px; height: 32px;
            border-radius: 10px;
            background: var(--primary-light);
            font-size: 1rem;
        }

        /* ─────────── Welcome ─────────── */
        .welcome-wrap {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
        }
        .welcome-illust {
            font-size: 3.6rem;
            line-height: 1;
            margin-bottom: 1.2rem;
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-light), var(--accent-soft));
            width: 96px; height: 96px;
            border-radius: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }
        .welcome-wrap h2 {
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.6rem;
        }
        .welcome-wrap p {
            color: var(--text-soft);
            font-size: 0.98rem;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
            margin: 2rem auto 0;
            max-width: 720px;
        }
        .feature-card {
            background: var(--primary-soft);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 1.1rem 1.2rem;
            text-align: left;
            transition: all 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .feature-card .feature-icon {
            font-size: 1.4rem;
            margin-bottom: 0.4rem;
            display: block;
        }
        .feature-card h4 {
            color: var(--primary-dark);
            font-size: 0.98rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .feature-card p {
            font-size: 0.85rem;
            color: var(--text-soft);
            line-height: 1.6;
        }

        /* ─────────── Upload zone ─────────── */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 2.8rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--cream);
        }
        .upload-zone:hover, .upload-zone.dragging {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: scale(1.005);
        }
        .upload-zone .icon {
            font-size: 2.4rem;
            margin-bottom: 0.8rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .upload-zone:hover .icon { transform: translateY(-3px); }
        .upload-zone p {
            color: var(--text-soft);
            font-size: 0.95rem;
        }
        .upload-zone strong { color: var(--primary-dark); font-weight: 600; }
        .upload-zone input { display: none; }

        /* ─────────── Buttons ─────────── */
        .btn {
            padding: 0.65rem 1.3rem;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: -0.01em;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(91, 142, 125, 0.25);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(91, 142, 125, 0.35);
        }
        .btn-primary:disabled {
            background: #B5C5BE;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-outline {
            background: white;
            color: var(--primary-dark);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
        }
        .btn-accent {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(232, 168, 124, 0.3);
        }
        .btn-accent:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
        }

        /* ─────────── Child info card ─────────── */
        .child-info-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--primary-soft) 0%, var(--cream) 100%);
            border: 1px solid var(--primary-light);
        }
        .child-info-card .label {
            font-size: 0.78rem;
            color: var(--text-light);
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .child-info-card .name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin: 0.3rem 0 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .child-info-card .meta {
            font-size: 0.85rem;
            color: var(--text-soft);
        }

        /* ─────────── Tabs ─────────── */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            padding: 0.4rem;
            background: var(--cream-dark);
            border-radius: 14px;
            border: 1px solid var(--border-soft);
        }
        .tab {
            flex: 1;
            padding: 0.65rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-light);
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .tab:hover { color: var(--primary-dark); }
        .tab.active {
            color: white;
            background: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(91, 142, 125, 0.25);
        }

        /* ─────────── Score cards ─────────── */
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.9rem;
        }
        .score-card {
            padding: 1.2rem 1.1rem;
            border-radius: var(--radius);
            text-align: left;
            border: 1px solid transparent;
            transition: transform 0.2s ease;
            position: relative;
        }
        .score-card:hover { transform: translateY(-2px); }
        .score-card.normal { background: var(--signal-green-bg); border-color: rgba(136, 179, 131, 0.3); }
        .score-card.subclinical { background: var(--signal-yellow-bg); border-color: rgba(217, 169, 60, 0.3); }
        .score-card.clinical { background: var(--signal-coral-bg); border-color: rgba(216, 122, 94, 0.3); }
        .score-card .label-main {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .score-card .label-sub {
            font-size: 0.74rem;
            color: var(--text-light);
            font-weight: 500;
            margin-top: 0.1rem;
        }
        .score-card .desc {
            font-size: 0.78rem;
            color: var(--text-soft);
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        .score-card .value-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 0.9rem;
            padding-top: 0.7rem;
            border-top: 1px dashed rgba(0,0,0,0.08);
        }
        .score-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .score-card .value .t-prefix {
            font-size: 0.72rem;
            color: var(--text-light);
            font-weight: 500;
            margin-right: 0.2rem;
        }
        .score-card .category-pill {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-soft);
            padding: 0.18rem 0.55rem;
            background: rgba(255,255,255,0.6);
            border-radius: 999px;
        }

        /* ─────────── Scale bars ─────────── */
        .scale-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border-soft);
        }
        .scale-item:last-child { border-bottom: none; }
        .scale-name {
            width: 130px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }
        .scale-bar-wrap {
            flex: 1;
            height: 26px;
            background: var(--cream-dark);
            border-radius: 13px;
            position: relative;
            overflow: hidden;
        }
        .scale-bar {
            height: 100%;
            border-radius: 13px;
            min-width: 28px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            animation: bar-fill 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes bar-fill {
            from { width: 0 !important; }
        }
        .scale-bar span {
            font-size: 0.78rem;
            color: white;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .scale-bar.green { background: linear-gradient(90deg, #A2C9A0 0%, #88B383 100%); }
        .scale-bar.yellow { background: linear-gradient(90deg, #ECCC7E 0%, #D9A93C 100%); }
        .scale-bar.orange { background: linear-gradient(90deg, #ECA88E 0%, #D87A5E 100%); }
        .scale-signal { font-size: 1.15rem; width: 28px; text-align: center; }
        .scale-category {
            width: 70px;
            font-size: 0.78rem;
            color: var(--text-soft);
            text-align: right;
            font-weight: 500;
        }
        .scale-legend {
            margin-top: 1rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border-soft);
            font-size: 0.8rem;
            color: var(--text-soft);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        /* ─────────── Comments ─────────── */
        .comment {
            font-style: italic;
            color: var(--text-soft);
            margin: 0.5rem 0;
            padding: 0.6rem 0.9rem;
            background: var(--cream);
            border-left: 3px solid var(--accent);
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
        }

        /* ─────────── Chat ─────────── */
        .chat-container {
            display: flex;
            flex-direction: column;
            min-height: 480px;
        }
        .example-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            padding: 0.9rem 1.2rem 0.4rem;
        }
        .chip {
            padding: 0.42rem 0.85rem;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .chip:hover {
            border-color: var(--primary);
            background: white;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            max-height: 480px;
        }
        .chat-empty {
            padding: 2rem 1.2rem 1rem;
            text-align: center;
            color: var(--text-light);
        }
        .chat-empty p { line-height: 1.7; }
        .chat-msg {
            max-width: 82%;
            padding: 0.85rem 1.05rem;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.7;
            animation: msg-in 0.3s ease;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: var(--primary-soft);
            color: var(--text);
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-soft);
        }
        .chat-input-wrap {
            display: flex;
            gap: 0.5rem;
            padding: 0.9rem 1.2rem;
            border-top: 1px solid var(--border-soft);
            background: var(--cream);
        }
        .chat-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .chat-input:disabled { background: #f5f5f5; }

        /* ─────────── Care signal banner ─────────── */
        .care-banner {
            margin: 0.9rem 1.2rem 0;
            padding: 1rem 1.1rem 1rem 1.3rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            line-height: 1.65;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            animation: fade-up 0.4s ease;
            position: relative;
        }
        .care-banner::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: var(--radius) 0 0 var(--radius);
        }
        .care-banner.warning {
            background: linear-gradient(135deg, #FBF1D8 0%, #FAF6F0 100%);
            border: 1px solid #E8C66B;
            color: #6B5414;
        }
        .care-banner.warning::before { background: #D9A93C; }
        .care-banner.danger {
            background: linear-gradient(135deg, #F9E2D8 0%, #FBE9DC 100%);
            border: 1px solid #D87A5E;
            color: #7A2A14;
        }
        .care-banner.danger::before { background: #D87A5E; }
        .care-banner .body { flex: 1; }
        .care-banner .title { font-weight: 700; margin-bottom: 0.3rem; font-size: 0.95rem; }
        .care-banner .actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }
        .care-banner button {
            padding: 0.45rem 0.95rem;
            border: 1px solid currentColor;
            background: rgba(255,255,255,0.7);
            color: inherit;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .care-banner button:hover { background: white; }
        .care-banner .dismiss {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            line-height: 1;
            opacity: 0.5;
            cursor: pointer;
            padding: 0;
            margin-top: -2px;
        }
        .care-banner .dismiss:hover { opacity: 1; }

        /* ─────────── Markdown rendering ─────────── */
        .md-content { line-height: 1.9; font-size: 0.95rem; color: var(--text); }
        .md-content h3 {
            color: var(--primary-dark);
            margin: 1.3rem 0 0.6rem;
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .md-content h3:first-child { margin-top: 0; }
        .md-content strong { color: var(--text); font-weight: 700; }
        .md-content ul, .md-content ol {
            padding-left: 0;
            margin: 0.5rem 0;
            list-style: none;
        }
        .md-content li {
            margin: 0.55rem 0;
            line-height: 1.75;
            padding-left: 0;
        }
        .md-content li::marker { content: ''; }
        /* Q&A 채팅 메시지 안의 list도 동일하게 */
        .chat-msg.assistant ul, .chat-msg.assistant ol {
            padding-left: 0;
            margin: 0.5rem 0;
            list-style: none;
        }
        .chat-msg.assistant li {
            margin: 0.55rem 0;
            line-height: 1.75;
            padding-left: 0;
        }
        .chat-msg.assistant li::marker { content: ''; }
        .md-content p { margin: 0.5rem 0; }
        .md-content blockquote {
