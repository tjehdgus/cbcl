<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ────────────────────────────────────────
        // API 호출
        // ────────────────────────────────────────
        const API = {
            async upload(file) {
                const form = new FormData();
                form.append('file', file);
                const res = await fetch('/api/upload', { method: 'POST', body: form });
                if (!res.ok) throw new Error((await res.json()).detail);
                return res.json();
            },
            async easyReportStream(reportContext, onChunk, onDone) {
                const res = await fetch('/api/easy-report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ report_context: reportContext }),
                });
                if (!res.ok) {
                    let detail = '서버 오류';
                    try { detail = (await res.json()).detail || detail; } catch {}
                    throw new Error(detail);
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') { onDone(); return; }
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) onChunk(parsed.content);
                            } catch {}
                        }
                    }
                }
                onDone();
            },
            async chatStream(reportContext, history, question, onChunk, onDone) {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ report_context: reportContext, conversation_history: history, question }),
                });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') { onDone(); return; }
                            try { onChunk(JSON.parse(data).content); } catch {}
                        }
                    }
                }
                onDone();
            },
            async careCheck(history) {
                const res = await fetch('/api/care-signal-check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conversation_history: history }),
                });
                if (!res.ok) return null;
                return res.json();
            },
            async counselorHandoff(reportContext, history) {
                const res = await fetch('/api/counselor-handoff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ report_context: reportContext, conversation_history: history }),
                });
                if (!res.ok) throw new Error((await res.json()).detail);
                return res.json();
            },
            async submitFeedback(rating, question, answer, comment) {
                try {
                    await fetch('/api/feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rating, question, answer, comment }),
                    });
                } catch (e) { /* silent */ }
            },
            async simplifyClinical(interpretation, observations) {
                const res = await fetch('/api/simplify-clinical', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interpretation, observations }),
                });
                if (!res.ok) return null;
                return res.json();
            },
        };

        // ────────────────────────────────────────
        // Helpers
        // ────────────────────────────────────────
        // 보고서 풀어보기 출력을 계층 구조로 파싱
        // 큰 섹션(### 헤딩) → 안의 영역(**...**) → 영역 안의 단락들
        function parseEasyReport(text) {
            if (!text) return [];
            const sections = [];
            const lines = text.split('\n');
            let curSection = null;
            let curSub = null;
            let buffer = [];

            const pushBuffer = () => {
                if (buffer.length === 0) return;
                const content = buffer.join('\n').trim();
                if (curSub) curSub.body += (curSub.body ? '\n\n' : '') + content;
                else if (curSection) curSection.body += (curSection.body ? '\n\n' : '') + content;
                buffer = [];
            };
            const flushSub = () => {
                pushBuffer();
                if (curSub) {
                    curSection.subs.push(curSub);
                    curSub = null;
                }
            };
            const flushSection = () => {
                flushSub();
                if (curSection) {
                    sections.push(curSection);
                    curSection = null;
                }
            };

            // 영역명 후보 — bold 마커 또는 "이름(괄호풀이)" 형식의 짧은 라인
            const isAreaTitle = (s) => {
                const t = s.trim();
                if (!t) return null;
                // ① bold 마커 형식 **제목** [신호등]
                const bold = t.match(/^\*\*([^*]+)\*\*\s*(.*)$/);
                if (bold) return { title: bold[1].trim(), signal: bold[2].trim() };
                // ② "이름(괄호풀이)" + 선택적 신호등. 라인이 짧고 본문 패턴 아닐 때만
                if (t.length > 50) return null;
                // 본문 시작 패턴 제외 ("이 영역은", "우리 아이는" 등)
                if (/^(이 영역|우리 아이|아이의|상담|또래|혼자|두통|슬픔|걱정|연령|이는|학교|친구|새로운|보호자|환경|현재|즉각|개별|이번|전반|전체적)/.test(t)) return null;
                // 한국어 + 괄호 형식
                const labeled = t.match(/^([가-힣A-Za-z/·\s]+?)\s*\(([^)]+)\)\s*([🟢🟡🟠]*)\s*$/);
                if (labeled) return {
                    title: `${labeled[1].trim()}(${labeled[2].trim()})`,
                    signal: labeled[3].trim(),
                };
                return null;
            };

            for (const raw of lines) {
                const line = raw;
                const h3 = line.match(/^###\s+(.+)/);
                if (h3) {
                    flushSection();
                    curSection = { title: h3[1].trim(), body: '', subs: [] };
                    continue;
                }
                const area = isAreaTitle(line);
                if (area && curSection) {
                    flushSub();
                    curSub = { title: area.title, signal: area.signal, body: '' };
                } else {
                    buffer.push(line);
                }
            }
            flushSection();
            return sections;
        }

        // 답변에서 '이런 것도 궁금하실 수 있어요:' 섹션을 본문과 분리
        function splitFollowups(text) {
            if (!text) return { body: '', followups: [] };
            const marker = /이런\s*것도\s*궁금하실\s*수\s*있어요\s*[:：]?/;
            const m = text.match(marker);
            if (!m) return { body: text, followups: [] };
            const idx = text.search(marker);
            const body = text.slice(0, idx).trim();
            // 마커 다음 텍스트에서 '-', '•', '*' 또는 '숫자.'로 시작하는 줄을 추출
            const tail = text.slice(idx).split('\n').slice(1);
            const followups = [];
            for (const raw of tail) {
                const ln = raw.trim();
                if (!ln) continue;
                const itemMatch = ln.match(/^[\-•*·]\s*(.+?)\s*$/) || ln.match(/^\d+\.\s*(.+?)\s*$/);
                if (itemMatch) {
                    followups.push(itemMatch[1].trim().replace(/^["“”]|["“”]$/g, ''));
                } else if (followups.length === 0 && ln.endsWith('?')) {
                    // bullet 없는 줄도 질문이면 채택
                    followups.push(ln.replace(/^["“”]|["“”]$/g, ''));
                }
            }
            return { body, followups };
        }

        // 인계 메모 전용 후처리 — 헤딩 이모지 + "(3가지)" + 번호 매기기 정리
        function cleanHandoffNote(text) {
            if (!text) return '';
            return text
                // em-dash·en-dash → 일반 hyphen
                .replace(/[—–]/g, '-')
                // 헤딩 라인의 이모지 제거 (### 📋 → ###)
                .replace(/^(#{1,6}\s*)[📋💭🔍🎯⚠️📌📊✨🌱🤝]+\s*/gm, '$1')
                // "(3가지)", "(N개)" 같은 카운트 제거
                .replace(/(상담\s*추천\s*우선\s*화제)\s*\(\d+\s*가지?\)/g, '$1')
                // "1. 2. 3." 번호 매기기 → "- " bullet (인계 메모 헤딩 다음 4줄 안에서만)
                .replace(/(### [^\n]*\n(?:[^\n#]*\n)?)((?:\s*\d+\.\s+[^\n]+\n?){2,})/g,
                    (m, head, body) => head + body.replace(/^\s*\d+\.\s+/gm, '- '))
                // 잔여 이모지 제거
                .replace(/[📎💭📋🔍🎯⚠️📌📊✨]/g, '')
                .trim();
        }

        // 리스트 일관성 보정 — 일부 라인만 bullet이 있고 다른 라인이 빠진 경우, 영역명: 패턴 라인에 - 추가
        function fixMixedBullets(text) {
            const lines = text.split('\n');
            const out = [];
            let inList = false;
            for (const line of lines) {
                const trimmed = line.trim();
                const isBullet = /^[-•*]\s+/.test(trimmed);
                const isEmpty = trimmed === '';
                if (isBullet) {
                    inList = true;
                    out.push(line);
                } else if (isEmpty) {
                    inList = false;
                    out.push(line);
                } else if (inList && /^(\*\*[^*]+\*\*|[가-힣A-Za-z·\s/()]{2,40})\s*[:：]/.test(trimmed)) {
                    // 리스트 흐름 안에서 "이름: ..." 형식 라인 → bullet 누락으로 보고 - 추가
                    out.push('- ' + trimmed);
                } else {
                    inList = false;
                    out.push(line);
                }
            }
            return out.join('\n');
        }

        // LLM 출력 후처리 — 라벨 제거 + 단락 빈 줄 강제 (마크다운 줄바꿈 보장)
        function cleanLLMOutput(text) {
            if (!text) return '';
            let out = text
                // em-dash·en-dash → 일반 hyphen으로 통일
                .replace(/[—–]/g, '-')
                // 답변 본문 안의 "1. 2. 3." 번호 매기기 → "- " bullet 통일
                .replace(/^\s*\d+\.\s+/gm, '- ');
            // 일부 라인만 bullet인 mixed list 보정
            out = fixMixedBullets(out);
            return out
                // 이모지 흔적 제거 (LLM이 가끔 가이드 무시할 때 보험)
                .replace(/📎\s*/g, '')
                .replace(/💭\s*/g, '')
                // 본문 라벨 제거 ("- 어떤 영역인가요: " 등)
                .replace(/^[\-•·]?\s*어떤 영역인가요\s*[:：]\s*/gm, '')
                .replace(/^[\-•·]?\s*우리 아이는\s*[:：]\s*/gm, '')
                .replace(/^[\-•·]?\s*함께 살펴볼 점\s*[:：]\s*/gm, '')
                .replace(/^[\-•·]?\s*T점수와 그 의미\s*[:：]\s*/gm, '')
                .replace(/^[\-•·]?\s*일상에서의 모습\s*[:：]\s*/gm, '')
                // 근거·유사 질문 앞에 빈 줄 강제 (마크다운 단락 구분)
                .replace(/(\S)[ \t]*\n?(?=근거\s*[:：])/g, '$1\n\n')
                .replace(/(\S)[ \t]*\n?(?=이런\s*것도\s*궁금하실)/g, '$1\n\n')
                // 척도 헤딩(**...**) 앞뒤로 빈 줄 보강
                .replace(/(\S)\n(\*\*[^\n*]+\*\*)/g, '$1\n\n$2')
                // 연속 공백 줄 3개 이상은 2개로 정리
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        const scoreClass = (cat) => cat === '정상' ? 'normal' : cat === '준임상' ? 'subclinical' : 'clinical';
        const barClass = (cat) => cat === '정상' ? 'green' : cat === '준임상' ? 'yellow' : 'orange';
        // 보고서 원문 용어를 보호자 관점 표현으로 변환 (원문도 부제로 함께 표기)
        const friendlyCategory = (cat) => ({
            '정상': '또래와 비슷한 수준',
            '준임상': '또래보다 조금 높은 편',
            '임상': '상담에서 함께 확인 권장',
        })[cat] || cat;

        // ────────────────────────────────────────
        // 메인 앱
        // ────────────────────────────────────────
        function App() {
            const [reportData, setReportData] = useState(null);
            const [reportContext, setReportContext] = useState('');
            const [activeTab, setActiveTab] = useState('report');
            const [easyReport, setEasyReport] = useState('');
            const [easyLoading, setEasyLoading] = useState(false);
            const [messages, setMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [chatLoading, setChatLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [apiKeyOk, setApiKeyOk] = useState(null);
            const [careSignal, setCareSignal] = useState(null);
            const [careDismissed, setCareDismissed] = useState(false);
            const [handoffNote, setHandoffNote] = useState('');
            const [handoffLoading, setHandoffLoading] = useState(false);
            const [clinicalSummary, setClinicalSummary] = useState(null);
            const [clinicalLoading, setClinicalLoading] = useState(false);
            const [showOriginalInterp, setShowOriginalInterp] = useState(false);
            const chatEndRef = useRef(null);
            const fileRef = useRef(null);

            useEffect(() => {
                fetch('/api/health').then(r => r.json()).then(d => setApiKeyOk(d.openai_key_configured)).catch(() => setApiKeyOk(false));
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            async function handleUpload(file) {
                if (!file) return;
                setUploading(true);
                setClinicalSummary(null);
                try {
                    const data = await API.upload(file);
                    setReportData(data);
                    setReportContext(data.report_context);
                    setEasyReport('');
                    setMessages([]);
                    setCareSignal(null);
                    setCareDismissed(false);
                    setHandoffNote('');
                    setActiveTab('report');

                    // 임상가 종합 해석·관찰 소견을 보호자 친화 풀이로 자동 변환 (백그라운드)
                    const hasInterp = data.comprehensive_interpretation && data.comprehensive_interpretation.length > 0;
                    const hasObs = data.observations && data.observations.length > 0;
                    if (hasInterp || hasObs) {
                        setClinicalLoading(true);
                        API.simplifyClinical(
                            data.comprehensive_interpretation || [],
                            data.observations || [],
                        ).then((result) => {
                            if (result && result.success && result.summary) {
                                setClinicalSummary({
                                    summary: result.summary,
                                    key_points: result.key_points || [],
                                });
                            }
                        }).catch(() => {/* silent */}).finally(() => setClinicalLoading(false));
                    }
                } catch (e) {
                    alert('보고서 업로드 실패: ' + e.message);
                } finally {
                    setUploading(false);
                }
            }

            async function handleGenerateReport() {
                setEasyLoading(true);
                setEasyReport('');
                let full = '';
                try {
                    await API.easyReportStream(
                        reportContext,
                        (chunk) => {
                            full += chunk;
                            setEasyReport(full);
                        },
                        () => setEasyLoading(false),
                    );
                } catch (e) {
                    alert('보고서 생성 실패: ' + e.message);
                    setEasyLoading(false);
                }
            }

            async function handleHandoff() {
                if (handoffLoading) return;
                setHandoffLoading(true);
                setHandoffNote('');
                try {
                    const data = await API.counselorHandoff(reportContext, messages);
                    setHandoffNote(data.content);
                } catch (e) {
                    alert('인계 메모 생성 실패: ' + e.message);
                } finally {
                    setHandoffLoading(false);
                }
            }

            async function handleSendChat(question) {
                if (!question.trim() || chatLoading) return;
                const q = question.trim();
                setChatInput('');
                const newMsgs = [...messages, { role: 'user', content: q }];
                setMessages([...newMsgs, { role: 'assistant', content: '' }]);
                setChatLoading(true);

                let fullResponse = '';
                const history = newMsgs.slice(0, -1);

                await API.chatStream(
                    reportContext, history, q,
                    (chunk) => {
                        fullResponse += chunk;
                        setMessages([...newMsgs, { role: 'assistant', content: fullResponse }]);
                    },
                    async () => {
                        const finalMsgs = [...newMsgs, { role: 'assistant', content: fullResponse }];
                        setMessages(finalMsgs);
                        setChatLoading(false);
                        try {
                            const signal = await API.careCheck(finalMsgs);
                            if (signal && (signal.level === 'warning' || signal.level === 'danger')) {
                                setCareSignal(signal);
                                setCareDismissed(false);
                            }
                        } catch (e) { /* silent */ }
                    }
                );
            }

            // ────────────────────────────────────────
            // 렌더링
            // ────────────────────────────────────────
            return (
                <div>
                    {/* Header */}
                    <header className="header">
                        <div className="header-inner">
                            <h1>맘이음</h1>
                            <p className="tagline">검사 결과를 보호자와 함께 살펴드립니다</p>
                        </div>
                    </header>

                    {/* Status bar */}
                    <div className="status-bar">
                        <span style={{color: 'var(--text-light)'}}>OpenAI API:</span>
                        {apiKeyOk === null ? (
                            <span className="status" style={{background: '#F0EAE0', color: 'var(--text-light)'}}>
                                <span className="dot"/>확인 중…
                            </span>
                        ) : apiKeyOk ? (
                            <span className="status ok"><span className="dot"/>연결됨</span>
                        ) : (
                            <span className="status missing"><span className="dot"/>환경변수 필요</span>
                        )}
                    </div>

                    <div className="container">
                        {!reportData ? (
                            /* ─── Welcome / Upload ─── */
                            <div>
                                <div className="card">
                                    <div
                                        className="upload-zone"
                                        onClick={() => fileRef.current?.click()}
                                        onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dragging'); }}
                                        onDragLeave={(e) => e.currentTarget.classList.remove('dragging')}
                                        onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('dragging'); handleUpload(e.dataTransfer.files[0]); }}
                                    >
                                        {uploading ? (
                                            <div className="spinner" style={{width:32,height:32,borderWidth:3, marginBottom: '0.8rem'}}/>
                                        ) : (
                                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{marginBottom: '0.7rem', color: 'var(--primary)'}}>
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" strokeLinecap="round" strokeLinejoin="round"/>
                                                <polyline points="14 2 14 8 20 8" strokeLinecap="round" strokeLinejoin="round"/>
                                                <line x1="9" y1="13" x2="15" y2="13" strokeLinecap="round"/>
                                                <line x1="9" y1="17" x2="13" y2="17" strokeLinecap="round"/>
                                            </svg>
                                        )}
                                        <p><strong>CBCL 검사 결과 PDF</strong>를 끌어다 놓거나 클릭해서 올려주세요</p>
                                        <input ref={fileRef} type="file" accept=".pdf" onChange={(e) => handleUpload(e.target.files[0])} />
                                    </div>
                                </div>

                                <div className="welcome-wrap">
                                    <h2>검사 결과를 함께 살펴봐요</h2>
                                    <p>전문 용어가 가득한 보고서, 혼자 보시기 어려우셨죠.<br/>맘이음이 보호자 곁에서 차근차근 짚어드립니다.</p>
                                    <div className="features">
                                        <div className="feature-card">
                                            <h4>보고서 풀어보기</h4>
                                            <p>T점수·백분위·내재화/외현화 같은 보고서 용어를 보호자 관점에서 다시 정리해드립니다</p>
                                        </div>
                                        <div className="feature-card">
                                            <h4>궁금한 점 물어보기</h4>
                                            <p>보고서에 대해 궁금한 점을 편하게 질문하실 수 있어요</p>
                                        </div>
                                        <div className="feature-card">
                                            <h4>보호자 마음 살피기</h4>
                                            <p>보호자님의 부담이 큰 신호가 보이면 상담 일정을 앞당겨 드릴 수 있도록 안내해요</p>
                                        </div>
                                        <div className="feature-card">
                                            <h4>상담 전 인계 메모</h4>
                                            <p>지금까지의 대화를 정리해 상담 선생님께 미리 전해드릴 수 있어요</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* ─── Main content ─── */
                            <div>
                                {/* Child info */}
                                <div className="card child-info-card">
                                    <div>
                                        <div className="label">검사 대상</div>
                                        <div className="name">
                                            {reportData.child_info.name} ({reportData.child_info.gender} · {reportData.child_info.age})
                                        </div>
                                        <div className="meta">
                                            검사일 {reportData.child_info.test_date} &nbsp;·&nbsp; 규준 {reportData.child_info.norm_group}
                                        </div>
                                    </div>
                                    <button className="btn btn-outline" onClick={() => { setReportData(null); setEasyReport(''); setMessages([]); setCareSignal(null); setHandoffNote(''); }}>
                                        다른 보고서 보기
                                    </button>
                                </div>

                                {/* Tabs */}
                                <div className="tabs">
                                    <button className={`tab ${activeTab === 'report' ? 'active' : ''}`} onClick={() => setActiveTab('report')}>검사 결과</button>
                                    <button className={`tab ${activeTab === 'easy' ? 'active' : ''}`} onClick={() => setActiveTab('easy')}>보고서 풀어보기</button>
                                    <button className={`tab ${activeTab === 'chat' ? 'active' : ''}`} onClick={() => setActiveTab('chat')}>궁금한 점 묻기</button>
                                </div>

                                {/* ─── Tab: 검사 결과 ─── */}
                                {activeTab === 'report' && (
                                    <div>
                                        {/* 가장 먼저: 임상가 종합 해석을 보호자 친화 풀이로 변환한 카드 */}
                                        {(clinicalLoading || clinicalSummary) && (
                                            <div className="card" style={{borderLeft:'4px solid var(--primary)'}}>
                                                <h3>이 검사 결과를 한눈에</h3>
                                                {clinicalLoading && !clinicalSummary && (
                                                    <div style={{display:'flex', alignItems:'center', gap:'0.6rem', padding:'0.6rem 0', color:'var(--text-soft)'}}>
                                                        <div className="spinner"/>
                                                        <span>임상가 평어를 보호자 관점에서 풀어드리고 있어요…</span>
                                                    </div>
                                                )}
                                                {clinicalSummary && clinicalSummary.summary && (
                                                    <>
                                                        <p style={{lineHeight:1.85, fontSize:'0.97rem', margin:'0.4rem 0 1rem', color:'var(--text)'}}>
                                                            {clinicalSummary.summary}
                                                        </p>
                                                        {clinicalSummary.key_points && clinicalSummary.key_points.length > 0 && (
                                                            <div style={{padding:'0.9rem 1.1rem', background:'#F0F7F3',
                                                                          border:'1px solid #C8DCD2', borderRadius:'10px'}}>
                                                                <div style={{fontSize:'0.82rem', fontWeight:600, color:'#467566', marginBottom:'0.5rem'}}>
                                                                    함께 짚어볼 만한 점
                                                                </div>
                                                                <ul style={{margin:0, paddingLeft:'1.2rem', fontSize:'0.9rem',
                                                                              color:'var(--text)', lineHeight:1.75}}>
                                                                    {clinicalSummary.key_points.map((kp, i) => <li key={i}>{kp}</li>)}
                                                                </ul>
                                                            </div>
                                                        )}
                                                        <div className="disclaimer" style={{marginTop:'0.9rem'}}>
                                                            참고. 위 내용은 보고서의 임상가 종합 해석·영역별 관찰 소견을 AI가 보호자 관점에서 다시 정리한 것입니다.
                                                            진단·처방이 아니며, 자세한 해석은 상담 선생님과 함께 확인해 주세요.
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        )}

                                        <div className="card">
                                            <h3>크게 세 가지로 본 결과</h3>
                                            <div className="scores-grid">
                                                {[
                                                    {
                                                        label: '감정·기분의 영역',
                                                        sub: '보고서 표기: 내재화 문제',
                                                        desc: '걱정·위축·신체 호소 등 안으로 드러나는 어려움',
                                                        data: reportData.composite_scores.internalizing,
                                                    },
                                                    {
                                                        label: '행동·표현의 영역',
                                                        sub: '보고서 표기: 외현화 문제',
                                                        desc: '다툼·규칙 위반·공격성 등 밖으로 드러나는 어려움',
                                                        data: reportData.composite_scores.externalizing,
                                                    },
                                                    {
                                                        label: '전체 합계',
                                                        sub: '보고서 표기: 총 문제행동',
                                                        desc: '두 영역을 함께 종합한 지표',
                                                        data: reportData.composite_scores.total,
                                                    },
                                                ].map(({ label, sub, desc, data }) => (
                                                    <div key={label} className={`score-card ${scoreClass(data.category)}`}>
                                                        <div className="label-main">{label}</div>
                                                        <div className="label-sub">{sub}</div>
                                                        <div className="desc">{desc}</div>
                                                        <div className="value-row">
                                                            <div className="value"><span className="t-prefix">T점수</span>{data.t_score}</div>
                                                            <div className="category-pill">{friendlyCategory(data.category)}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="card">
                                            <h3>여덟 가지 영역별로 본 결과</h3>
                                            <p style={{color:'var(--text-soft)', fontSize:'0.85rem', marginBottom:'0.7rem'}}>
                                                척도는 <b>내재화 증후군</b>(감정 안쪽), <b>혼합 증후군</b>(중간), <b>외현화 증후군</b>(행동 표현)의 세 그룹으로 묶여 있습니다.
                                            </p>
                                            {reportData.scales.map((s) => (
                                                <div key={s.name} className="scale-item">
                                                    <div className="scale-name">{s.name}</div>
                                                    <div className="scale-bar-wrap">
                                                        <div
                                                            className={`scale-bar ${barClass(s.category)}`}
                                                            style={{ width: `${Math.min(100, (s.t_score / 80) * 100)}%` }}
                                                        >
                                                            <span>{s.t_score}</span>
                                                        </div>
                                                    </div>
                                                    <div className="scale-signal">{s.signal}</div>
                                                    <div className="scale-category">{s.category}</div>
                                                </div>
                                            ))}
                                            <div className="scale-legend">
                                                <span>🟢 또래와 비슷 (T&lt;60)</span>
                                                <span>🟡 또래보다 조금 높음 (T 60-69)</span>
                                                <span>🟠 상담에서 함께 확인 (T≥70)</span>
                                            </div>
                                        </div>

                                        {/* 주요 관찰 소견 (Ⅴ) — 임상가 평어 */}
                                        {reportData.observations && reportData.observations.length > 0 && (
                                            <div className="card">
                                                <h3>임상가 주요 관찰 소견</h3>
                                                <p style={{color:'var(--text-soft)', fontSize:'0.86rem', marginBottom:'0.9rem'}}>
                                                    검사자가 영역별로 관찰한 주요 소견입니다. 임상 진단이 아닌 관찰 메모이며, 상담 시 함께 살펴보시면 도움이 됩니다.
                                                </p>
                                                <div style={{display:'flex', flexDirection:'column', gap:'0.7rem'}}>
                                                {reportData.observations.map((o, i) => (
                                                    <div key={i} style={{padding:'0.8rem 1rem', background:'#FAF6F0',
                                                                          border:'1px solid #E8D9C2', borderRadius:'10px'}}>
                                                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', flexWrap:'wrap', gap:'0.5rem'}}>
                                                            <strong style={{color:'var(--text)', fontSize:'0.95rem'}}>{o.area}</strong>
                                                            <span style={{fontSize:'0.82rem', color:'var(--text-light)'}}>
                                                                T={o.t_score} · {o.classification}
                                                            </span>
                                                        </div>
                                                        {o.notes && o.notes.length > 0 && (
                                                            <ul style={{margin:'0.4rem 0 0 0', paddingLeft:'1.2rem', fontSize:'0.86rem',
                                                                          color:'var(--text-soft)', lineHeight:1.65}}>
                                                                {o.notes.map((n, j) => <li key={j}>{n}</li>)}
                                                            </ul>
                                                        )}
                                                    </div>
                                                ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* 종합 해석 (Ⅵ) — 임상가 종합 평가 */}
                                        {reportData.comprehensive_interpretation && reportData.comprehensive_interpretation.length > 0 && (
                                            <div className="card">
                                                <h3>임상가 종합 해석</h3>
                                                <div style={{padding:'1rem 1.2rem', background:'#F0F7F3',
                                                              border:'1px solid #C8DCD2', borderRadius:'10px',
                                                              fontSize:'0.92rem', lineHeight:1.75, color:'var(--text)'}}>
                                                    {reportData.comprehensive_interpretation.map((para, i) => (
                                                        <p key={i} style={{margin: i === 0 ? '0 0 0.8rem' : '0 0 0.8rem'}}>{para}</p>
                                                    ))}
                                                </div>
                                                <div className="disclaimer" style={{marginTop:'0.8rem'}}>
                                                    참고. 위 해석은 검사 보고서에 포함된 임상가 의견을 그대로 옮긴 것이며, 진단·처방이 아닙니다.
                                                </div>
                                            </div>
                                        )}

                                        {/* 특수 척도 (Ⅳ) — SPECIAL SCALES */}
                                        {reportData.special_scales && reportData.special_scales.length > 0 && (
                                            <div className="card">
                                                <h3>특수 척도 (SPECIAL SCALES)</h3>
                                                <p style={{color:'var(--text-soft)', fontSize:'0.86rem', marginBottom:'0.9rem'}}>
                                                    한국 아동에게 특화된 추가 척도입니다. 본 검사에서의 실시 여부와 권장 사항을 확인하세요.
                                                </p>
                                                <div style={{display:'flex', flexDirection:'column', gap:'0.7rem'}}>
                                                    {reportData.special_scales.map((s, i) => {
                                                        const isPending = s.status === '미실시';
                                                        return (
                                                            <div key={i} style={{padding:'0.85rem 1.05rem', background:'white',
                                                                                  border:'1px solid var(--border)', borderRadius:'10px',
                                                                                  fontSize:'0.9rem'}}>
                                                                {/* 척도명 + 연령 + 상태 chip 인라인 */}
                                                                <div style={{display:'flex', alignItems:'center', gap:'0.5rem', flexWrap:'wrap', marginBottom:'0.4rem'}}>
                                                                    <strong style={{fontSize:'0.96rem', color:'var(--text)'}}>{s.name}</strong>
                                                                    <span style={{display:'inline-flex', alignItems:'center',
                                                                                    fontSize:'0.78rem', padding:'0.18rem 0.55rem',
                                                                                    background:'#F0F7F3', color:'#467566',
                                                                                    border:'1px solid #C8DCD2', borderRadius:'999px', fontWeight:500}}>
                                                                        {s.age_range}
                                                                    </span>
                                                                    <span style={{display:'inline-flex', alignItems:'center',
                                                                                    fontSize:'0.78rem', padding:'0.18rem 0.55rem',
                                                                                    background: isPending ? '#FBF5E5' : '#F0F7F3',
                                                                                    color: isPending ? '#7A5614' : '#467566',
                                                                                    border: isPending ? '1px solid #E8C66B' : '1px solid #C8DCD2',
                                                                                    borderRadius:'999px', fontWeight:600}}>
                                                                        {s.status}
                                                                    </span>
                                                                </div>
                                                                <div style={{color:'var(--text-soft)', lineHeight:1.7}}>{s.note}</div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        {reportData.parent_comments.length > 0 && (
                                            <div className="card">
                                                <h3>보호자께서 검사지에 적어주신 의견</h3>
                                                {reportData.parent_comments.map((c, i) => (
                                                    <div key={i} className="comment">"{c}"</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* ─── Tab: 보고서 풀어보기 ─── */}
                                {activeTab === 'easy' && (
                                    <div className="card">
                                        {!easyReport && !easyLoading ? (
                                            <div style={{textAlign:'center', padding:'2.4rem 1rem 1.6rem'}}>
                                                <p style={{marginBottom:'1.6rem', color:'var(--text-soft)', lineHeight: 1.7, fontSize: '0.96rem'}}>
                                                    검사 보고서를 보호자 관점에서 다시 정리해드립니다.<br/>
                                                    <span style={{fontSize: '0.85rem', color: 'var(--text-light)'}}>전문 용어는 일상어로 풀이하고, 중요한 부분은 상담 선생님과 함께 확인할 수 있도록 짚어드려요.</span>
                                                </p>
                                                <button
                                                    className="btn btn-primary"
                                                    onClick={handleGenerateReport}
                                                    style={{padding: '0.8rem 1.6rem'}}
                                                >
                                                    보고서 풀어보기
                                                </button>
                                            </div>
                                        ) : (
                                            <div>
                                                {easyLoading && !easyReport && (
                                                    <div style={{display: 'flex', alignItems: 'center', gap: '0.6rem', padding: '1rem 0', color: 'var(--text-soft)'}}>
                                                        <div className="spinner"/>
                                                        <span>차근차근 정리하고 있어요…</span>
                                                    </div>
                                                )}
                                                {easyReport && (() => {
                                                    const sections = parseEasyReport(cleanLLMOutput(easyReport));
                                                    return (
                                                        <div className="streaming-content">
                                                            {sections.map((sec, si) => (
                                                                <div key={si} className="report-section">
                                                                    <h4 className="section-title">{sec.title}</h4>
                                                                    {sec.body && (
                                                                        <div className="section-intro"
                                                                             dangerouslySetInnerHTML={{__html: marked.parse(sec.body)}} />
                                                                    )}
                                                                    {sec.subs.map((sub, ki) => (
                                                                        <div key={ki} className="report-subsection">
                                                                            <div className="sub-title">
                                                                                {sub.title}
                                                                                {sub.signal && <span className="signal">{sub.signal}</span>}
                                                                            </div>
                                                                            <div className="sub-body"
                                                                                 dangerouslySetInnerHTML={{__html: marked.parse(sub.body)}} />
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            ))}
                                                            {easyLoading && <span className="typing-caret"></span>}
                                                        </div>
                                                    );
                                                })()}
                                                {!easyLoading && (
                                                    <>
                                                        <div className="disclaimer">
                                                            참고. 이 내용은 AI가 보고서를 보호자 관점에서 다시 정리한 보조 자료입니다. 임상적 해석은 상담 선생님과 함께 확인해 주세요.
                                                        </div>
                                                        <div style={{marginTop:'1rem', textAlign:'right'}}>
                                                            <button className="btn btn-outline" onClick={() => setEasyReport('')}>다시 정리하기</button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* ─── Tab: Q&A 챗봇 ─── */}
                                {activeTab === 'chat' && (
                                    <div className="card" style={{padding:0, overflow:'hidden'}}>
                                        <div className="chat-container">
                                            {/* 위기 시그널 케어 배너 */}
                                            {careSignal && !careDismissed && (careSignal.level === 'warning' || careSignal.level === 'danger') && (
                                                <div className={`care-banner ${careSignal.level}`}>
                                                    <div className="body">
                                                        <div className="title">
                                                            {careSignal.level === 'danger' ? '잠시 멈추고 도움을 받아보세요' : '보호자님의 마음도 함께 살펴드릴게요'}
                                                        </div>
                                                        <div>{careSignal.suggestion}</div>
                                                        <div className="actions">
                                                            {careSignal.action === 'expedite_or_emergency' && (
                                                                <>
                                                                    <button onClick={() => alert('상담 일정 조정 페이지로 이동 (PoC 미구현)')}>상담 일정 앞당기기</button>
                                                                    <button onClick={() => window.open('tel:1577-0199')}>1577-0199 (정신건강 상담)</button>
                                                                </>
                                                            )}
                                                            {careSignal.action === 'offer_reschedule' && (
                                                                <button onClick={() => alert('상담 일정 조정 페이지로 이동 (PoC 미구현)')}>상담 일정 조정 알아보기</button>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <button className="dismiss" onClick={() => setCareDismissed(true)} title="닫기">×</button>
                                                </div>
                                            )}

                                            {messages.length === 0 && (
                                                <div className="chat-empty">
                                                    <p>보고서에 대해 궁금한 점을 편하게 물어보세요.</p>
                                                    <p style={{fontSize: '0.82rem', color: 'var(--text-muted)', marginTop: '0.3rem'}}>
                                                        진단·처방에 해당하는 질문은 상담 선생님께 안내드릴게요.
                                                    </p>
                                                </div>
                                            )}

                                            <div className="example-chips">
                                                {['T점수가 뭔가요?', '준임상이 뭐예요?', '주의집중 점수가 어떤 의미인지 궁금해요', '상담에서 어떤 걸 물어보면 좋을까요?'].map((q) => (
                                                    <button key={q} className="chip" onClick={() => handleSendChat(q)} disabled={chatLoading}>{q}</button>
                                                ))}
                                            </div>

                                            <div className="chat-messages">
                                                {messages.map((m, i) => {
                                                    if (m.role !== 'assistant') {
                                                        return <div key={i} className="chat-msg user">{m.content}</div>;
                                                    }
                                                    const cleaned = cleanLLMOutput(m.content);
                                                    const { body, followups } = splitFollowups(cleaned);
                                                    return (
                                                        <div key={i} className="chat-msg assistant">
                                                            <span dangerouslySetInnerHTML={{ __html: marked.parse(body || '...') }} />
                                                            {!chatLoading && followups.length > 0 && (
                                                                <div className="followup-row">
                                                                    <div className="followup-label">이런 것도 궁금하실 수 있어요</div>
                                                                    <div className="followup-chips">
                                                                        {followups.map((q, k) => (
                                                                            <button key={k} className="followup-chip"
                                                                                onClick={() => handleSendChat(q)}
                                                                                disabled={chatLoading}>
                                                                                {q}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {!chatLoading && m.content && (
                                                                <div className="feedback-row">
                                                                    <span>도움이 되셨나요?</span>
                                                                    <button
                                                                        className={`feedback-btn ${m.feedback === 'up' ? 'selected' : ''}`}
                                                                        onClick={() => {
                                                                            const prevQ = i > 0 ? messages[i-1].content : '';
                                                                            API.submitFeedback('up', prevQ, m.content, '');
                                                                            setMessages(messages.map((mm, j) => j === i ? {...mm, feedback: 'up'} : mm));
                                                                        }}
                                                                    >좋아요</button>
                                                                    <button
                                                                        className={`feedback-btn ${m.feedback === 'down' ? 'selected' : ''}`}
                                                                        onClick={() => {
                                                                            const prevQ = i > 0 ? messages[i-1].content : '';
                                                                            const comment = window.prompt('어떤 부분이 아쉬웠나요? (선택, 한 줄)') || '';
                                                                            API.submitFeedback('down', prevQ, m.content, comment);
                                                                            setMessages(messages.map((mm, j) => j === i ? {...mm, feedback: 'down'} : mm));
                                                                        }}
                                                                    >별로</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                                <div ref={chatEndRef} />
                                            </div>

                                            <div className="chat-input-wrap">
                                                <input
                                                    className="chat-input"
                                                    placeholder="궁금한 점을 입력해 주세요…"
                                                    value={chatInput}
                                                    onChange={(e) => setChatInput(e.target.value)}
                                                    onKeyDown={(e) => e.key === 'Enter' && handleSendChat(chatInput)}
                                                    disabled={chatLoading}
                                                />
                                                <button
                                                    className="btn btn-primary"
                                                    onClick={() => handleSendChat(chatInput)}
                                                    disabled={chatLoading || !chatInput.trim()}
                                                >
                                                    {chatLoading ? <div className="spinner"/> : '전송'}
                                                </button>
                                            </div>
                                        </div>

                                        {/* ─── 상담사 인계 메모 ─── */}
                                        {messages.filter(m => m.role === 'user').length >= 2 && (
                                            <div className="handoff-section">
                                                {!handoffNote ? (
                                                    <div className="handoff-promo">
                                                        <div className="promo-text">
                                                            <strong>상담 선생님께 미리 전해드릴까요?</strong>
                                                            지금까지의 대화를 정리해 인계 메모로 만들어드립니다.
                                                        </div>
                                                        <button
                                                            className="btn btn-accent"
                                                            onClick={handleHandoff}
                                                            disabled={handoffLoading}
                                                        >
                                                            {handoffLoading ? <><div className="spinner"/> 정리 중…</> : '인계 메모 만들기'}
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="handoff-letter">
                                                        <div className="handoff-header">
                                                            <div className="handoff-title">상담 선생님께 드리는 메모</div>
                                                            <div className="handoff-actions">
                                                                <button className="btn btn-outline" onClick={() => navigator.clipboard.writeText(handoffNote).then(() => alert('복사되었습니다'))}>복사</button>
                                                                <button className="btn btn-outline" onClick={() => setHandoffNote('')}>다시 정리</button>
                                                            </div>
                                                        </div>
                                                        <div className="md-content"
                                                             dangerouslySetInnerHTML={{ __html: marked.parse(cleanHandoffNote(handoffNote)) }} />
                                                        <div className="disclaimer">
                                                            참고. 이 메모는 보호자-AI 대화에서 추출한 보조 자료이며, 임상 판단의 근거가 아닙니다.
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
